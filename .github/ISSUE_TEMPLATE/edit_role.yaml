name: Edit Role
description: Edit a Job Posting on our list
title: "Editing Role"
labels: ["edit_role"]
body:
  - type: markdown
    attributes:
      value: |
        ## Edit Job Posting Form
        Thanks for taking the time to contribute!
        Make sure you've read `CONTRIBUTING.md` before submitting your edits.
        Please only fill in **link, reason, and whichever fields you would like to edit**.
        You may leave the others empty.
  - type: input
    id: url
    attributes:
      label: Link to Job Posting
      placeholder: ex. example.com/link/to/posting
    validations:
      required: true
  - type: input
    id: company
    attributes:
      label: Company Name
      placeholder: ex. Google
    validations:
      required: false
  - type: input
    id: title
    attributes:
      label: Job Title
      placeholder: ex. Software Engineer I (Fresher)
    validations:
      required: false
  - type: input
    id: location
    attributes:
      label: Location
      description: |
        Where is the job located?
        Separate locations with a pipe "|" if there are multiple options.
        Include Remote if a remote option is available.
      placeholder: ex. Bengaluru | Hyderabad | Remote
    validations:
      required: false
  - type: input
    id: website
    attributes:
      label: Company website
      description: The company's own site, e.g. https://example.com — used to show its logo. Leave empty unless adding or fixing it.
      placeholder: ex. https://example.com
    validations:
      required: false
  - type: dropdown
    id: sponsorship
    attributes:
      label: Does this job offer sponsorship?
      description: For information only (India roles may not specify sponsorship).
      multiple: false
      options:
        - Offers Sponsorship
        - Does Not Offer Sponsorship
        - Other
    validations:
      required: false
  - type: dropdown
    id: active
    attributes:
      label: Is this posting currently accepting applications?
      description: Mark this as "No" if the job is no longer accepting applications.
      multiple: false
      options:
        - "Yes"
        - "No"
    validations:
      required: false
  - type: checkboxes
    id: advanced_degree
    attributes:
      label: Advanced Degree Requirements
      description: Check this box only if this position specifically requires a Master's degree, PhD, or other advanced degree (and does NOT accept Bachelor's degrees).
      options:
        - label: "This position requires a Master's degree or higher"
  - type: checkboxes
    id: is_visible
    attributes:
      label: Permanently remove this job from the list?
      description: Only check this box if this job is fake, does not fit the theme of the repo, or is offensive. DO NOT check this box for jobs that are simply no longer active (use "No" above instead).
      options:
        - label: "Yes, remove this job"
  - type: textarea
    id: reason
    attributes:
      label: Reason for edit
      description: If the reason for your edit is not obvious, please explain here.
      placeholder: This job is no longer accepting applications...
    validations:
      required: false